<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Number Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            font-size: 1em;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .results {
            margin-top: 20px;
        }

        .results h2 {
            margin-bottom: 10px;
        }

        .results ul {
            list-style: none;
            padding: 0;
        }

        .results li {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Xtyle Phone Number Info</h1>
        <form method="POST" action="/">
            <input type="text" name="phone" placeholder="Enter phone number" required />
            <button type="submit">Validate</button>
        </form>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        {% if location_info %}
        <div class="results">
            <h2>Results:</h2>
            <ul>
                <li><strong>Country:</strong> {{ location_info.country }}</li>
                <li><strong>Carrier:</strong> {{ location_info.carrier }}</li>
                <li><strong>Location:</strong> {{ location_info.location }}</li>
                <li><strong>Line Type:</strong> {{ location_info.line_type }}</li>
            </ul>
        </div>
        {% endif %}
    </div>
</body>
</html>
